name: Итоги месяца
on:
  schedule:
    - cron: "0 18 * * *"   # каждый день в 21:00 по Москве; скрипт шлёт сводку только в последний день месяца
  workflow_dispatch:
    inputs:
      force:
        description: "Отправить сводку прямо сейчас"
        type: boolean
        default: false
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]"
      - run: python summary.py ${{ inputs.force && '--force' || '' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIMEZONE: Europe/Moscow
