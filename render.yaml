services:
  - type: web
    name: fambuhbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TIMEZONE
        value: Europe/Moscow
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
